# Publish a Release APK (trigger manually or automatically by pushing a v* tag).
name: Release

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code (including submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Extract version number
        run: |
          if [ "${{ github.ref_type }}" = "tag" ]; then
            VERSION="${{ github.ref_name }}"
            VERSION="${VERSION#v}"
          else
            VERSION="0.0.0-dev"
          fi
          echo "APP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "Version: $VERSION"

      - name: Install NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ~/vcpkg
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          # In manifest mode (vcpkg.json + CMAKE_TOOLCHAIN_FILE), dependencies use the binary cache,
          # located at ~/.cache/vcpkg/archives by default; explicitly specify a fixed directory to control the cache path.
          # (~/vcpkg/packages and ~/vcpkg/buildtrees are used only by classic-mode install and are empty here.)
          mkdir -p "$HOME/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg-binary-cache" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          # This configuration must exactly match build-apk.yml and build-check.yml; all three share the same cache.
          path: ~/vcpkg-binary-cache
          key: vcpkg-bincache-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: vcpkg-bincache-

      - name: Decode keystore
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > keystore.jks
            echo "KEYSTORE_PATH=${GITHUB_WORKSPACE}/keystore.jks" >> $GITHUB_ENV
            echo "Keystore decoded"
          else
            echo "KEYSTORE_BASE64 is not configured; using default signing"
          fi

      - name: Install build tools (vcpkg libusb requires autotools)
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Build APK
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug assembleRelease -PversionName=$APP_VERSION

      - name: Rename APK
        run: |
          mkdir -p apks
          cp app/build/outputs/apk/debug/app-debug.apk "apks/usbipdcpp-v${APP_VERSION}-debug.apk"
          cp app/build/outputs/apk/release/app-release.apk "apks/usbipdcpp-v${APP_VERSION}-release.apk"
          ls -lh apks/

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usbipdcpp-v${{ env.APP_VERSION }}
          path: apks/*.apk
          if-no-files-found: error

      - name: Publish to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: apks/*.apk
          generate_release_notes: true
          # Publish as a pre-release by default; manually change to a full release after successful validation.
          prerelease: true
