# Manually build an APK (build validation only, no publishing).
name: Build APK

on:
  workflow_dispatch:
    inputs:
      build_type:
        description: 'Build type'
        required: true
        type: choice
        default: 'debug'
        options:
          - debug
          - release

jobs:
  build:
    name: Build ${{ inputs.build_type }} APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code (including submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ~/vcpkg
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          # In manifest mode (vcpkg.json + CMAKE_TOOLCHAIN_FILE), dependencies use the binary cache,
          # located at ~/.cache/vcpkg/archives by default; explicitly specify a fixed directory to control the cache path.
          # (~/vcpkg/packages and ~/vcpkg/buildtrees are used only by classic-mode install and are empty here.)
          mkdir -p "$HOME/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg-binary-cache" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          # This configuration must exactly match release.yml and build-check.yml; all three share the same cache.
          path: ~/vcpkg-binary-cache
          key: vcpkg-bincache-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: vcpkg-bincache-

      - name: Install build tools (vcpkg libusb requires autotools)
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Build APK
        run: |
          chmod +x gradlew
          ./gradlew assemble${{ inputs.build_type == 'debug' && 'Debug' || 'Release' }}

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: usbipdcpp-${{ inputs.build_type }}
          path: app/build/outputs/apk/${{ inputs.build_type }}/*.apk
          if-no-files-found: error
