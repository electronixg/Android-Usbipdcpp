# Build validation for commits and PRs: build debug only, without publishing any artifacts.
name: Build Check

on:
  push:
    branches: [main]
    paths-ignore:
      - '**.md'
      - 'LICENSE'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'LICENSE'

jobs:
  build:
    name: Build Debug APK
    runs-on: ubuntu-24.04

    steps:
      - name: Check out code (including submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Verify JNI error codes match the Kotlin mirror
        run: |
          # ErrorCode is mirrored across languages (C++ values pass unchanged through JNI to Kotlin). Comments on both sides
          # remind each other, but compilation cannot detect missed updates, so compare statically here. Limit extraction to each
          # ErrorCode definition block so other newly added constants are not mistakenly included. If line formatting inside the block
          # changes, update the regex accordingly; empty extraction fails immediately rather than silently passing.
          cpp=$(awk '/^namespace ErrorCode \{/,/^\}/' app/src/main/cpp/usbipd_jni.cpp \
            | grep -oE 'constexpr int [A-Z_]+ = [0-9]+' | sed 's/constexpr int //' | sort)
          kotlin=$(awk '/object ErrorCode \{/,/^\s*\}/' app/src/main/java/com/yunsmall/usbipdcpp/UsbIpNative.kt \
            | grep -oE 'const val [A-Z_]+ = [0-9]+' | sed 's/const val //' | sort)
          if [ -z "$cpp" ] || [ -z "$kotlin" ]; then
            echo "::error::ErrorCode extraction is empty (definition block format may have changed; check this step's regex)"
            exit 1
          fi
          if [ "$cpp" != "$kotlin" ]; then
            echo "::error::ErrorCode differs between sides (C++ on the left, Kotlin on the right):"
            diff <(echo "$cpp") <(echo "$kotlin") || true
            exit 1
          fi
          echo "ErrorCode matches:$(echo "$cpp" | grep -c '=') entries"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'

      - name: Install NDK 29.0.14033849
        run: |
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --licenses 2>/dev/null || true
          yes | $ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager --install "ndk;29.0.14033849" 2>/dev/null
          echo "ANDROID_NDK_HOME=$ANDROID_HOME/ndk/29.0.14033849" >> $GITHUB_ENV

      - name: Set up vcpkg
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git ~/vcpkg
          echo "VCPKG_ROOT=$HOME/vcpkg" >> $GITHUB_ENV
          # In manifest mode (vcpkg.json + CMAKE_TOOLCHAIN_FILE), dependencies use the binary cache,
          # located at ~/.cache/vcpkg/archives by default; explicitly specify a fixed directory to control the cache path.
          # (~/vcpkg/packages and ~/vcpkg/buildtrees are used only by classic-mode install and are empty here.)
          mkdir -p "$HOME/vcpkg-binary-cache"
          echo "VCPKG_DEFAULT_BINARY_CACHE=$HOME/vcpkg-binary-cache" >> $GITHUB_ENV

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ hashFiles('**/*.gradle.kts', '**/*.gradle', 'gradle/libs.versions.toml') }}
          restore-keys: gradle-

      - name: Cache vcpkg binary cache
        uses: actions/cache@v4
        with:
          # This configuration must exactly match release.yml and build-apk.yml; all three share the same cache.
          path: ~/vcpkg-binary-cache
          key: vcpkg-bincache-${{ hashFiles('app/src/main/cpp/vcpkg.json') }}
          restore-keys: vcpkg-bincache-

      - name: Install build tools (vcpkg libusb requires autotools)
        run: sudo apt-get install -y autoconf autoconf-archive automake libtool

      - name: Build Debug APK
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          # The build already took several minutes; exporting artifacts takes only seconds. Include the sha to identify the commit.
          name: usbipdcpp-debug-${{ github.sha }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
